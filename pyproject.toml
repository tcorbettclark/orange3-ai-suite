# orange3-ai-suite packaging.
#
# The Orange add-on: ten widgets and the signal adapters that convert between
# Orange objects and edu-ai-suite's types. The model and feature logic is
# edu-ai-suite, a plain-Python dependency with no Orange and no Qt.
#
# Dependency floors are the versions used for development; the LoRA extra
# forwards to edu-ai-suite's own extra.

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "orange3-ai-suite"
version = "0.0.1"
description = "Teaching neural networks and LLMs inside Orange: ten widgets over edu-ai-suite's image features, tiny Keras language models and MLX LoRA fine-tuning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.12,<5",
    "edu-ai-suite>=0.0.1,<0.1.0",
]

[project.optional-dependencies]
# The widgets' LoRA features need MLX, which edu-ai-suite owns. The extra is
# forwarded so pip install "orange3-ai-suite[lora]" still installs it.
lora = ["edu-ai-suite[lora]>=0.0.1,<0.1.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "huggingface-hub>=0.29",
    "scikit-learn>=1.4",
]

[project.entry-points."orange.widgets"]
"Language Models" = "orangecontrib.ai_suite.widgets"

[project.entry-points."Orange.widgets"]
"Language Models" = "orangecontrib.ai_suite.widgets"

[tool.hatch.build.targets.wheel]
packages = ["orangecontrib"]
# orangecontrib is a PEP 420 namespace shared with other add-ons; Orange
# >= 3.38 discovers add-ons through entry points. The same entry point is
# deliberately registered under both spellings ("orange.widgets" per the
# namespace package, "Orange.widgets" per older discovery code) - keep both.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: end-to-end runs needing converted-model loads (run with '-m slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning:keras.*",
    "ignore::DeprecationWarning:orangecanvas.*",
]

[tool.release]
smoke = "import orangecontrib.ai_suite as add_on; print(add_on.__file__)"
dependency = "edu-ai-suite"
tests = [
    ["uv", "run", "pytest"],
    ["${ORANGE_PYTHON:-/Applications/Orange.app/Contents/MacOS/python}", "-m", "pytest", "tests/widgets"],
]
test_env = { QT_QPA_PLATFORM = "offscreen" }
slow = [["${ORANGE_PYTHON:-/Applications/Orange.app/Contents/MacOS/python}", "-m", "pytest", "-m", "slow", "tests/widgets"]]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF003", "RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["orangecontrib"]
