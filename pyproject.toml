# orange3-ai-suite packaging.
#
# Dependency floors are the versions used for development. The MLX extra is
# pinned exactly: the tuner internals are less stable than Keras's fit.
#
# Layout: orangecontrib.ai_suite bundles the Orange widgets and a plain-Python
# kernel in one distribution - one wheel, one install, three toolbox categories.

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "orange3-ai-suite"
version = "0.0.1"
description = "Teaching neural networks and LLMs inside Orange: interpretable image features, tiny Keras language models, MLX LoRA fine-tuning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

# Base: what the pure-Python kernel needs. numpy/scipy are also pulled in by
# Orange itself, so this costs nothing there and keeps plain-Python kernel
# tests runnable. Orange3 is deliberately absent: the Orange environment
# already provides it, and the kernel must be installable headless.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    # The widget suite is meant to work out of the box: image features need
    # OpenCV, the language models need Keras on a TensorFlow backend, and the
    # architectures are scikit-learn estimators.
    "opencv-python-headless>=4.12,<5",
    "keras>=3.10.0",
    "tensorflow>=2.19.0",  # keras' backend, declared rather than implied
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Only LoRA is optional: MLX is Apple-silicon-only, so it cannot be a hard
# requirement. Everything else is a plain dependency.
lora = [
    # Apple-silicon-only: mlx is not portable.
    'mlx-lm[train]==0.32.2; platform_machine == "arm64" and sys_platform == "darwin"',
    # The downloader and cache use the Hub; mlx-lm pulls it in, but the
    # downloader names it directly.
    "huggingface-hub>=0.29",
]

# Development-only tooling (PEP 735 group, installed by `uv sync` by default).
[dependency-groups]
dev = [
    "pytest>=8",
    "opencv-python-headless>=4.12,<5",
    "huggingface-hub>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["orangecontrib"]
# orangecontrib is a PEP 420 namespace shared with other add-ons; Orange
# >= 3.38 discovers add-ons through entry points.

[project.entry-points."orange.widgets"]
"Language Models" = "orangecontrib.ai_suite.widgets"

[project.scripts]
orange-ai-assets = "orangecontrib.ai_suite.kernel.assets:main"

[project.entry-points."Orange.widgets"]
"Language Models" = "orangecontrib.ai_suite.widgets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: end-to-end runs needing converted-model loads (run with '-m slow')",
]
filterwarnings = [
    # Keras emits a DeprecationWarning about numpy 2's __array__ copy protocol
    # from third-party code, not from this project.
    "ignore::DeprecationWarning:keras.*",
    # orange-canvas-core warns about its own legacy localization module path;
    # nothing to do in this codebase.
    "ignore::DeprecationWarning:orangecanvas.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF003", "RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["orangecontrib", "synth"]
