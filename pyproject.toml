# orange3-nn-suite packaging.
#
# Dependency floors are the versions used for development. The MLX extra is
# pinned exactly: the tuner internals are less stable than Keras's fit.
#
# Layout: nn_kernel is a plain in-repo package bundled in this single
# distribution - one wheel, one install, three toolbox categories.

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "orange3-nn-suite"
version = "0.0.1"
description = "Teaching neural networks and LLMs inside Orange: interpretable image features, tiny Keras language models, MLX LoRA fine-tuning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

# Base: what the pure-Python kernel needs. numpy/scipy are also pulled in by
# Orange itself, so this costs nothing there and keeps plain-Python kernel
# tests runnable. Orange3 is deliberately absent: the Orange environment
# already provides it, and the kernel must be installable headless.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# One extra per capability; widgets degrade gracefully with an "install
# orange3-nn-suite[image]" style message.
image = [
    "opencv-python-headless>=4.12,<5",
]
lm = [
    "keras>=3.10.0",
    "tf-keras>=2.19.0",
]
lora = [
    # Apple-silicon-only: mlx is not portable.
    'mlx-lm[train]==0.32.2; platform_machine == "arm64" and sys_platform == "darwin"',
]

# Development-only tooling (PEP 735 group, installed by `uv sync` by default).
[dependency-groups]
dev = [
    "pytest>=8",
    "opencv-python-headless>=4.12,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["nn_kernel", "nn_suite"]
# nn_suite is a plain top-level package (no 'orangecontrib' namespace). Orange
# >= 3.38 discovers add-ons through entry points.

[project.entry-points."orange.widgets"]
"Language Models" = "nn_suite.widgets"

[project.entry-points."Orange.widgets"]
"Language Models" = "nn_suite.widgets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: end-to-end runs needing converted-model loads (run with '-m slow')",
]
filterwarnings = [
    # Keras emits a DeprecationWarning about numpy 2's __array__ copy protocol
    # from third-party code, not from this project.
    "ignore::DeprecationWarning:keras.*",
    # orange-canvas-core warns about its own legacy localization module path;
    # nothing to do in this codebase.
    "ignore::DeprecationWarning:orangecanvas.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF003", "RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["nn_kernel", "nn_suite", "synth"]
